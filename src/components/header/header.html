<header class="header" data-header>
  <div class="container header__inner">
    <a class="header__logo" href="#hero" aria-label="SpiceLand — на головну">
      <img class="header__logo-image" src="/src/assets/logos/logo.svg" alt="" />
    </a>

    <div class="header__actions">
      <a class="header__phone" href="tel:+380000000000" aria-label="Зателефонувати до SpiceLand">
        <span class="header__phone-content">
          <svg class="header__phone-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.6 10.8a15.8 15.8 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24c1.08.36 2.24.55 3.42.55a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.53 21 3 13.47 3 4.18a1 1 0 0 1 1-1H7.5a1 1 0 0 1 1 1c0 1.19.19 2.34.55 3.42a1 1 0 0 1-.25 1.02l-2.2 2.18Z" />
          </svg>
          <span class="header__phone-text">+38 (0XX) XXX-XX-XX</span>
        </span>
        <span class="header__phone-content header__phone-content--hover" aria-hidden="true">
          <svg class="header__phone-icon" width="18" height="18" viewBox="0 0 24 24">
            <path d="M6.6 10.8a15.8 15.8 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24c1.08.36 2.24.55 3.42.55a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.53 21 3 13.47 3 4.18a1 1 0 0 1 1-1H7.5a1 1 0 0 1 1 1c0 1.19.19 2.34.55 3.42a1 1 0 0 1-.25 1.02l-2.2 2.18Z" />
          </svg>
          <span class="header__phone-text">+38 (0XX) XXX-XX-XX</span>
        </span>
      </a>

      <button class="glass-button glass-button--compact header__request" type="button" data-modal-open="contact-modal">
        Залишити заявку
      </button>

      <a class="glass-button glass-button--compact header__contacts" href="#contacts">Контакти</a>

      <button
        class="menu-toggle header__menu-toggle"
        type="button"
        aria-label="Відкрити меню"
        aria-controls="burger-menu"
        aria-expanded="false"
        data-menu-toggle
      >
        <span class="menu-toggle__line"></span>
        <span class="menu-toggle__line"></span>
        <span class="menu-toggle__line"></span>
      </button>
    </div>
  </div>
</header>
