<div class="intro" role="status" aria-label="Завантаження сайту" data-intro>
  <div class="intro__liquid-stage" aria-hidden="true" data-liquid-stage>
    <div class="intro__liquid intro__liquid--orange" data-liquid="orange">
      <div class="intro__liquid-body" data-liquid-body="orange">
        <span class="intro__drop-tail"></span>
        <span class="intro__drop-core"></span>
        <span class="intro__drop-highlight"></span>
      </div>
    </div>
    <div class="intro__liquid intro__liquid--green" data-liquid="green">
      <div class="intro__liquid-body" data-liquid-body="green">
        <span class="intro__drop-tail"></span>
        <span class="intro__drop-core"></span>
        <span class="intro__drop-highlight"></span>
      </div>
    </div>
    <div class="intro__liquid intro__liquid--red" data-liquid="red">
      <div class="intro__liquid-body" data-liquid-body="red">
        <span class="intro__drop-tail"></span>
        <span class="intro__drop-core"></span>
        <span class="intro__drop-highlight"></span>
      </div>
    </div>
  </div>

  <div class="intro__collision" aria-hidden="true" data-liquid-collision>
    <span class="intro__collision-core"></span>
    <span class="intro__collision-drop intro__collision-drop--one"></span>
    <span class="intro__collision-drop intro__collision-drop--two"></span>
    <span class="intro__collision-drop intro__collision-drop--three"></span>
  </div>

  <div class="intro__brand" data-intro-brand>
    <span class="brand-mark brand-mark--intro brand-mark--gray" data-intro-gray>
      <img class="brand-mark__image" src="/src/assets/logos/logo.svg" alt="" />
    </span>
    <span class="brand-mark brand-mark--intro brand-mark--color" data-intro-color>
      <img class="brand-mark__image" src="/src/assets/logos/logo.svg" alt="" />
    </span>
    <span class="intro__wave intro__wave--one" data-intro-wave></span>
    <span class="intro__wave intro__wave--two" data-intro-wave></span>
  </div>
</div>

<section class="hero" id="hero" aria-labelledby="hero-title" data-hero>
  <div class="hero__scene" aria-hidden="true">
    <div class="hero__layer hero__layer--far" data-parallax-layer="0.28">
      <img class="hero__layer-image" src="/src/assets/images/hero-layer-far.webp" alt="" fetchpriority="high" decoding="async" />
    </div>
    <div class="hero__layer hero__layer--middle" data-parallax-layer="0.62">
      <img class="hero__layer-image" src="/src/assets/images/hero-layer-middle.webp" alt="" decoding="async" />
    </div>
    <div class="hero__layer hero__layer--front" data-parallax-layer="1">
      <img class="hero__layer-image" src="/src/assets/images/hero-layer-front.webp" alt="" decoding="async" />
    </div>
    <div class="hero__shade"></div>
  </div>

  <div class="hero__brand" data-hero-logo>
    <span class="hero__brand-glow"></span>
    <span class="hero__medallion" data-logo-medallion>
      <span class="hero__brand-depth hero__brand-depth--one" aria-hidden="true"></span>
      <span class="hero__brand-depth hero__brand-depth--two" aria-hidden="true"></span>
      <span class="hero__brand-depth hero__brand-depth--three" aria-hidden="true"></span>
      <span class="hero__brand-depth hero__brand-depth--four" aria-hidden="true"></span>
      <span class="hero__brand-depth hero__brand-depth--five" aria-hidden="true"></span>
      <span class="hero__brand-depth hero__brand-depth--six" aria-hidden="true"></span>
      <span class="hero__brand-depth hero__brand-depth--seven" aria-hidden="true"></span>
      <span class="brand-mark brand-mark--hero brand-mark--hero-front">
        <img class="brand-mark__image" src="/src/assets/logos/logo.svg" alt="" />
      </span>
      <span class="brand-mark brand-mark--hero brand-mark--hero-back" aria-hidden="true">
        <img class="brand-mark__image" src="/src/assets/logos/logo.svg" alt="" />
      </span>
    </span>
  </div>

  <div class="container hero__container">
    <div class="hero__content">
      <div class="hero__actions" data-hero-actions>
        <a class="glass-button hero__button" href="#catalog">
          <svg class="glass-button__icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5v-16ZM20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5v-16Z" />
          </svg>
          Перейти до каталогу
        </a>
        <button class="glass-button hero__button" type="button" data-modal-open="contact-modal">
          <svg class="glass-button__icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.6 10.8a15.8 15.8 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24c1.08.36 2.24.55 3.42.55a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.53 21 3 13.47 3 4.18a1 1 0 0 1 1-1H7.5a1 1 0 0 1 1 1c0 1.19.19 2.34.55 3.42a1 1 0 0 1-.25 1.02l-2.2 2.18Z" />
          </svg>
          Зворотний зв’язок
        </button>
      </div>

      <div class="hero__copy" data-hero-copy>
        <p class="hero__eyebrow">Вас вітає компанія</p>
        <h1 class="hero__title" id="hero-title">SpiceLand</h1>
        <p class="hero__positioning">Імпортер преміальних маринадів</p>
        <p class="hero__description">Ми постачаємо найкращі маринади з Німеччини, Франції та Нідерландів для ресторанів, м’ясних виробництв і роздрібних мереж. Якість, перевірена часом.</p>
      </div>
    </div>

    <button class="hero__orientation" type="button" data-orientation-permission hidden>
      Увімкнути рух фону
    </button>
  </div>

  <a class="hero__scroll" href="#catalog" aria-label="Перейти до каталогу">
    <span class="hero__scroll-line"></span>
  </a>
</section>
